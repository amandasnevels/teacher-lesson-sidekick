# Builds the Mac App Store version of Teacher Sidekick and uploads it to App Store Connect.
# Start it from GitHub: Actions → "Mac App Store" → Run workflow.
# Needs secrets: MAS_CERT_P12 (both App Store certificates, base64), MAS_CERT_PASSWORD,
# MAS_PROVISION_PROFILE (base64), and the existing APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER.
name: Mac App Store

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to App Store Connect (otherwise just build)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Public by design (the website ships the same values); accounts are protected by row-level security.
      NEXT_PUBLIC_SUPABASE_URL: https://tronfmkjcbpxfllgqzju.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyb25mbWtqY2JweGZsbGdxemp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MDk4NDYsImV4cCI6MjExMDM4NTg0Nn0.2YUVvIIL0xVNY8XhiZxagtlUPflDXBOM2qTLlSad_2I
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the offline copy
        run: |
          SIDEKICK_DESKTOP=1 npx next build
          rm -rf desktop/app && cp -R out desktop/app && rm -f desktop/app/sw.js desktop/app/sw.js.map
      - name: Load the App Store certificates and profile
        env:
          MAS_CERT_P12: ${{ secrets.MAS_CERT_P12 }}
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          MAS_PROVISION_PROFILE: ${{ secrets.MAS_PROVISION_PROFILE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          for s in MAS_CERT_P12 MAS_CERT_PASSWORD MAS_PROVISION_PROFILE; do
            if [ -z "${!s}" ]; then echo "::error::The $s secret is missing."; exit 1; fi
          done
          KC="$RUNNER_TEMP/mas.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$MAS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/mas.p12"
          security import "$RUNNER_TEMP/mas.p12" -k "$KC" -P "$MAS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/mas.p12"
          echo "Identities found:"; security find-identity -v "$KC" | sed 's/^ *[0-9]*) [0-9A-F]* //'
          APP_ID="$(security find-identity -v "$KC" | grep -oE '"(3rd Party Mac Developer Application|Apple Distribution):[^"]*"' | head -1 | tr -d '"')"
          INST_ID="$(security find-identity -v "$KC" | grep -oE '"(3rd Party Mac Developer Installer|Mac Installer Distribution):[^"]*"' | head -1 | tr -d '"')"
          if [ -z "$APP_ID" ]; then echo "::error::The Mac App Distribution certificate isn't in MAS_CERT_P12."; exit 1; fi
          if [ -z "$INST_ID" ]; then echo "::error::The Mac Installer Distribution certificate isn't in MAS_CERT_P12."; exit 1; fi
          echo "MAS_APP_IDENTITY=$APP_ID" >> "$GITHUB_ENV"
          echo "MAS_INSTALLER_IDENTITY=$INST_ID" >> "$GITHUB_ENV"
          echo "$MAS_PROVISION_PROFILE" | base64 --decode > "$RUNNER_TEMP/embedded.provisionprofile"
          echo "MAS_PROVISION_PROFILE_PATH=$RUNNER_TEMP/embedded.provisionprofile" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$APPLE_API_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          fi
      - name: Package the App Store app
        working-directory: desktop
        env:
          MAS_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          npm ci
          node package-mas.js
          pkgutil --check-signature dist-mas/Teacher-Sidekick-App-Store.pkg
          codesign -d --entitlements - "dist-mas/Teacher Sidekick-mas-universal/Teacher Sidekick.app" 2>/dev/null | head -40
      - name: Keep a copy of the installer
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Sidekick-App-Store-build-${{ github.run_number }}
          path: desktop/dist-mas/Teacher-Sidekick-App-Store.pkg
          retention-days: 30
      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun altool --upload-app --type macos --file desktop/dist-mas/Teacher-Sidekick-App-Store.pkg \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
