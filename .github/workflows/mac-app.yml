# Builds "Teacher Sidekick for Mac" on a Mac and publishes it on the Releases page.
# Start it from GitHub: Actions → "Mac app" → Run workflow.
name: Mac app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Public by design (the website ships the same values); accounts are protected by row-level security.
      NEXT_PUBLIC_SUPABASE_URL: https://tronfmkjcbpxfllgqzju.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyb25mbWtqY2JweGZsbGdxemp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MDk4NDYsImV4cCI6MjExMDM4NTg0Nn0.2YUVvIIL0xVNY8XhiZxagtlUPflDXBOM2qTLlSad_2I
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the offline copy
        run: |
          SIDEKICK_DESKTOP=1 npx next build
          rm -rf desktop/app && cp -R out desktop/app && rm -f desktop/app/sw.js desktop/app/sw.js.map
      - name: Load the signing certificate (when the secrets are set)
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then echo "No certificate secret: building an unsigned app."; exit 0; fi
          KC="$RUNNER_TEMP/sign.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          ID="$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application:[^"]*"' | head -1 | tr -d '"')"
          echo "Signing as: $ID"
          echo "MAC_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY" ]; then
            echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi
      - name: Package Apple Silicon + Intel apps
        working-directory: desktop
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npm ci
          node package-mac.js
          cd dist
          for pair in "arm64:Apple-Silicon" "x64:Intel"; do
            arch="${pair%%:*}"; name="${pair##*:}"
            rm -f "Teacher-Sidekick-Mac-$name.zip"
            app="Teacher Sidekick-darwin-$arch/Teacher Sidekick.app"
            if [ -z "$MAC_SIGN_IDENTITY" ]; then
              # No certificate yet: ad-hoc signature (free) so Apple Silicon Macs can run it at all.
              codesign --force --deep --sign - "$app"
            else
              # Signed + notarized: check that Apple's approval is attached.
              xcrun stapler validate "$app"
              spctl --assess --type execute -vv "$app"
            fi
            codesign --verify --deep --strict "$app"
            ditto -c -k --sequesterRsrc --keepParent "Teacher Sidekick-darwin-$arch/Teacher Sidekick.app" "Teacher-Sidekick-Mac-$name.zip"
          done
      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mac-$(date +%Y.%m.%d-%H%M)"
          cat > notes.md <<'NOTES'
          Download **Teacher Sidekick** for Mac — works offline.

          - **Apple Silicon** (M1, M2, M3, M4): Teacher-Sidekick-Mac-Apple-Silicon.zip
          - **Intel Macs**: Teacher-Sidekick-Mac-Intel.zip

          Install: unzip, drag **Teacher Sidekick** to Applications, then the first time **right-click → Open → Open**.
          If it's blocked: System Settings → Privacy & Security → **Open Anyway**.
          NOTES
          gh release create "$TAG" desktop/dist/Teacher-Sidekick-Mac-*.zip --target "$GITHUB_SHA" --latest --title "Teacher Sidekick for Mac ($TAG)" --notes-file notes.md
